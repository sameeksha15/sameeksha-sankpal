name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages reports where the site will actually live, custom domain and all,
      # so neither the sub-path nor the origin has to be guessed here.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Resolve site URLs
        run: |
          base='${{ steps.pages.outputs.base_path }}'
          # Next.js wants an empty basePath at the root, not "/".
          if [ "$base" = "/" ]; then base=""; fi
          echo "NEXT_PUBLIC_BASE_PATH=${base%/}" >> "$GITHUB_ENV"
          # Absolute links inside the RSS feed.
          echo "NEXT_PUBLIC_SITE_URL=${{ steps.pages.outputs.origin }}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
